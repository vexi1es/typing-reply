<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7cf6" />
    <title>Просто напиши</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Напиши" />
  </head>
  <body>
    <!-- Background: floating voice messages with absurd durations. Filled in by main.ts. -->
    <div id="voice-rain" aria-hidden="true"></div>

    <main id="app">
      <nav class="topbar">
        <span class="brand"><span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span><span data-i18n="brand">Просто напиши</span></span>
        <div class="lang-seg" role="radiogroup" aria-label="Язык">
          <button type="button" data-lang="ru" role="radio">RU</button>
          <button type="button" data-lang="uz" role="radio">UZ</button>
        </div>
      </nav>

      <header class="hero">
        <h1 data-i18n="heroTitle">Опять голосовое?</h1>
        <p class="lead" data-i18n="heroLead"></p>
      </header>

      <!-- onsubmit: until main.ts has loaded, the button must not reload the page -->
      <form id="form" onsubmit="return false">
        <section class="card">
          <h2 data-i18n="contactTitle">Кому отвечаешь</h2>
          <div class="contact">
            <label class="avatar-pick" id="avatar-pick">
              <img id="avatar-img" alt="" hidden />
              <span id="avatar-initials" class="avatar-initials" hidden></span>
              <span id="avatar-plus" class="avatar-plus" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
                  <circle cx="12" cy="13" r="3.5" />
                </svg>
              </span>
              <input id="avatar-input" type="file" accept="image/*" data-i18n-aria="photoAdd" />
            </label>
            <div class="contact-fields">
              <input id="name" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="contactNamePlaceholder" data-i18n-aria="contactName" />
              <button type="button" id="avatar-remove" class="link-btn" data-i18n="photoRemove" hidden></button>
            </div>
          </div>
          <label class="voice-len">
            <span class="label-row"><span data-i18n="voiceLabel">Длина голосового</span><b id="voice-value">1:23</b></span>
            <input id="voice" type="range" min="3" max="600" step="1" value="83" />
          </label>
          <p id="voice-hint" class="hint-soft" data-i18n="voiceHint" hidden></p>
        </section>

        <section class="card">
          <label>
            <span class="label-row"><span data-i18n="textLabel">Текст ответа</span><span id="counter"></span></span>
            <textarea id="text" rows="4" required data-i18n-placeholder="textPlaceholder"></textarea>
          </label>
          <label>
            <span data-i18n="modeLabel">Как печатать</span>
            <select id="mode">
              <option value="normal" data-i18n="modeNormal">Обычно</option>
              <option value="grandpa" data-i18n="modeGrandpa">Дед одним пальцем</option>
              <option value="typos" data-i18n="modeTypos">С опечатками</option>
              <option value="manicure" data-i18n="modeManicure">С маникюром 💅</option>
              <option value="breaks" data-i18n="modeBreaks">С перекурами ☕</option>
            </select>
          </label>
          <p id="limit-hint" class="hint" hidden></p>
        </section>

        <section class="card">
          <h2 data-i18n="lookLabel">Как выглядит чат</h2>
          <label class="voice-len">
            <span class="label-row"><span data-i18n="batteryLabel">Заряд батареи</span><b id="battery-value">85%</b></span>
            <input id="battery" type="range" min="1" max="100" step="1" value="85" />
          </label>
          <div class="themes" role="radiogroup">
            <label class="theme-tile tgd">
              <input type="radio" name="theme" value="telegram-dark" checked />
              <span class="mini" aria-hidden="true">
                <span class="mini-head"><i class="mini-ava"></i></span>
                <span class="mini-voice"><i></i></span>
                <span class="mini-out"></span>
              </span>
              <span class="theme-name" data-i18n="themeTelegramDark">Тёмный TG</span>
            </label>
            <label class="theme-tile tg">
              <input type="radio" name="theme" value="telegram" />
              <span class="mini" aria-hidden="true">
                <span class="mini-head"><i class="mini-ava"></i></span>
                <span class="mini-voice"><i></i></span>
                <span class="mini-out"></span>
              </span>
              <span class="theme-name" data-i18n="themeTelegram">Светлый TG</span>
            </label>
            <label class="theme-tile im">
              <input type="radio" name="theme" value="imessage" />
              <span class="mini" aria-hidden="true">
                <span class="mini-head"><i class="mini-ava"></i></span>
                <span class="mini-voice"><i></i></span>
                <span class="mini-out"></span>
              </span>
              <span class="theme-name" data-i18n="themeImessage">iMessage</span>
            </label>
          </div>
        </section>

        <button id="render" type="submit" class="cta" data-i18n="render">Сделать видео</button>
      </form>
    </main>

    <!-- Result sheet: opens on “Make the video” — progress first, then the video and “Send”. -->
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button type="button" id="sheet-close" class="icon-btn" data-i18n-aria="close" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="sheet-media">
          <video id="preview" playsinline muted loop autoplay></video>
          <div id="sheet-progress" class="sheet-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <span class="typing-dots big" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="sheet-pct" class="pct">0%</span>
            <span class="bar"><i id="sheet-bar"></i></span>
          </div>
        </div>
        <p id="sheet-note" class="note"></p>
        <button id="share" type="button" class="primary"></button>
        <p id="share-hint" class="note"></p>
        <button id="sheet-secondary" type="button" class="link-btn"></button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
